name: build-release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Checkout llm-sdk dependency
        shell: bash
        run: |
          LLM_SDK_COMMIT="b6e4a4890cc9a994fcf91e1502d7664b7ab36ff7"
          git clone --depth 1 https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/brainless/llm-sdk.git "$GITHUB_WORKSPACE/../llm-sdk"
          git -C "$GITHUB_WORKSPACE/../llm-sdk" fetch --depth 1 origin "$LLM_SDK_COMMIT"
          git -C "$GITHUB_WORKSPACE/../llm-sdk" checkout "$LLM_SDK_COMMIT"

      - name: Build production artifacts
        shell: bash
        env:
          DWATA_DEFAULT_GOOGLE_CLIENT_ID: ${{ secrets.DWATA_GOOGLE_CLIENT_ID }}
          DWATA_DEFAULT_GOOGLE_CLIENT_SECRET: ${{ secrets.DWATA_GOOGLE_CLIENT_SECRET }}
        run: ./scripts/build-production.sh

      - name: Package macOS API binary
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ARCH="$(uname -m)"
          tar -czf "dwata-api-${VERSION}-macos-${ARCH}.tar.gz" -C target/release dwata-api

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dwata-api-macos
          path: |
            dwata-api-*.tar.gz

      - name: Attach artifacts to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dwata-api-*.tar.gz
