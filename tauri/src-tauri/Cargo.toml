[package]
name = "dwata-desktop"
version = "0.6.1"
description = "Dwata desktop app"
edition = "2021"
license = "GPL-3.0-or-later"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [ "image-ico", "image-png"] }
tauri-plugin-shell = "2"
serde_json = "1"

[features]
prod = ["tauri/custom-protocol"]

[workspace]
