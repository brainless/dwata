[package]
name = "dwata-api"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Dwata API server - Personal data management system"

[dependencies]
actix-web.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
nocodo-llm-sdk = { package = "llm-sdk", path = "../../llm-sdk" }
dwata-agents = { path = "../dwata-agents" }
# manager-tools.workspace = true
shared-types = { path = "../shared-types" }
extractors = { path = "../extractors" }
rusqlite = { version = "0.32", features = ["bundled"] }
sqlx = { workspace = true, features = ["sqlite", "macros"] }
refinery = { version = "0.9.0", features = ["rusqlite"] }
chrono.workspace = true
uuid.workspace = true
anyhow.workspace = true
dirs = "5.0"
toml = "0.8"
tracing.workspace = true
  tracing-subscriber.workspace = true
  tracing-appender = "0.2"
clap.workspace = true
actix-cors = "0.6"
keyring = { version = "2.3" }
rand = "0.8"
tempfile = "3.8"
oauth2 = "4.4"
reqwest = { version = "0.11", features = ["json"] }
imap = "3.0.0-alpha.15"
native-tls = "0.2"
mail-parser = "0.9"
regex = "1.10"
futures = "0.3"
r2d2 = "0.8"
r2d2_sqlite = "0.25"
mime_guess = "2.0"
rust-embed = "8.5"
webbrowser = "0.8.15"
tantivy = "0.22"
rayon = "1.10"

[features]
default = []
vendored-openssl = ["native-tls/vendored"]

[package.metadata.deb]
assets = [
  ["target/release/dwata", "usr/bin/", "755"],
]

[package.metadata.generate-rpm]
assets = [
  { source = "target/release/dwata", dest = "/usr/bin/dwata", mode = "755" },
]

[package.metadata.bundle]
name = "Dwata API"
identifier = "com.dwata.api"
category = "DeveloperTool"
short_description = "Personal data management system"
long_description = "Dwata API server - A personal data management system that helps you organize and manage your email, tasks, and other personal data."
osx_minimum_system_version = "10.13"

